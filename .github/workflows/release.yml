name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check-types

      - name: Run source tests
        run: bun run test:sources

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile release binaries
        env:
          TARGETS: bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64
        run: |
          mkdir -p dist
          for target in $TARGETS; do
            (cd apps/server && bun build --compile --minify --target "$target" ./src/index.ts --outfile "../../dist/mangy-server-$target")
            (cd apps/worker && bun build --compile --minify --target "$target" ./src/index.ts --outfile "../../dist/mangy-worker-$target")
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true