name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DEFAULT_VITE_SERVER_URL: http://127.0.0.1:3000

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check-types

      - name: Build workspaces
        run: bun run build

  publish-images:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: mangy-web
            target: web
          - image_name: mangy-server
            target: server
          - image_name: mangy-worker
            target: worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: prep
        shell: bash
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve web server origin
        id: web_origin
        env:
          MANGY_WEB_SERVER_URL: ${{ vars.MANGY_WEB_SERVER_URL }}
          DEFAULT_VITE_SERVER_URL: ${{ env.DEFAULT_VITE_SERVER_URL }}
        shell: bash
        run: |
          if [ -n "$MANGY_WEB_SERVER_URL" ]; then
            echo "vite_server_url=$MANGY_WEB_SERVER_URL" >> "$GITHUB_OUTPUT"
          else
            echo "vite_server_url=$DEFAULT_VITE_SERVER_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SERVER_URL=${{ steps.web_origin.outputs.vite_server_url }}
          cache-from: type=gha,scope=publish-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.target }}
