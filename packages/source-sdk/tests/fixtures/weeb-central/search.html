<!doctype html>
<html lang="en">
  <body>
    <form id="advanced-search-form">
      <fieldset>
        <label>
          <input type="radio" name="sort" value="Best Match" checked>
          <span>Best Match</span>
        </label>
        <label>
          <input type="radio" name="sort" value="Popularity">
          <span>Popularity</span>
        </label>
        <label>
          <input type="radio" name="sort" value="Latest Updates">
          <span>Latest Updates</span>
        </label>
      </fieldset>
      <fieldset>
        <label>
          <input type="radio" name="order" value="Ascending">
          <span>Ascending</span>
        </label>
        <label>
          <input type="radio" name="order" value="Descending" checked>
          <span>Descending</span>
        </label>
      </fieldset>
      <fieldset>
        <label>
          <input type="radio" name="official" value="Any" checked>
          <span>Any</span>
        </label>
        <label>
          <input type="radio" name="official" value="True">
          <span>True</span>
        </label>
        <label>
          <input type="radio" name="official" value="False">
          <span>False</span>
        </label>
      </fieldset>
      <fieldset>
        <label>
          <input type="radio" name="anime" value="Any" checked>
          <span>Any</span>
        </label>
        <label>
          <input type="radio" name="anime" value="True">
          <span>True</span>
        </label>
        <label>
          <input type="radio" name="anime" value="False">
          <span>False</span>
        </label>
      </fieldset>
      <fieldset>
        <label>
          <input type="radio" name="adult" value="Any" checked>
          <span>Any</span>
        </label>
        <label>
          <input type="radio" name="adult" value="True">
          <span>True</span>
        </label>
        <label>
          <input type="radio" name="adult" value="False">
          <span>False</span>
        </label>
      </fieldset>
      <fieldset>
        <label>
          <input type="checkbox" name="included_status" value="Ongoing">
          <span>Ongoing</span>
        </label>
        <label>
          <input type="checkbox" name="included_status" value="Complete">
          <span>Complete</span>
        </label>
      </fieldset>
      <fieldset>
        <label>
          <input type="checkbox" name="included_type" value="Manga">
          <span>Manga</span>
        </label>
        <label>
          <input type="checkbox" name="included_type" value="Manhwa">
          <span>Manhwa</span>
        </label>
      </fieldset>
    </form>
  </body>
</html>
