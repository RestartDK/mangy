name: mangy

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - mangy

  server:
    image: ${GHCR_NAMESPACE}/mangy-server:${MANGY_IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      HOST: 0.0.0.0
      PORT: 3000
      TRACKING_POLL_INTERVAL_MS: ${TRACKING_POLL_INTERVAL_MS:-900000}
    ports:
      - ${SERVER_PORT:-3000}:3000
    volumes:
      - ${DOWNLOADS_PATH}:${DOWNLOADS_PATH}
    networks:
      - mangy

  web:
    image: ${GHCR_NAMESPACE}/mangy-web:${MANGY_IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - ${WEB_PORT:-3001}:3001
    networks:
      - mangy

  worker:
    image: ${GHCR_NAMESPACE}/mangy-worker:${MANGY_IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-15000}
      TRACKING_POLL_INTERVAL_MS: ${TRACKING_POLL_INTERVAL_MS:-900000}
    volumes:
      - ${DOWNLOADS_PATH}:${DOWNLOADS_PATH}
    networks:
      - mangy

networks:
  mangy:
    name: mangy
